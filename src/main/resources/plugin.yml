name: QuickMenu
version: ${project.version}
main: com.quickmenu.QuickMenu
api-version: '1.21'
softdepend: [floodgate]
author: QuickMenu
description: Dual-platform PlayerMenu-style menu plugin for Paper 26.2

commands:
  menu:
    description: Open a menu
    usage: /menu [menu]
    aliases: [playermenu]
  quickmenu:
    description: QuickMenu admin commands
    usage: /quickmenu <open|reload|close|getMaterial|version>
    permission: quickmenu.use

permissions:
  quickmenu.use:
    default: true
  quickmenu.admin:
    default: op
